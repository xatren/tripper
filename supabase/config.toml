# Minimal local/CI Supabase project config. Its only job is to let
# `supabase start` boot a disposable Postgres + Auth + Storage stack so
# supabase/tests/functional can apply every migration from scratch and run
# against it. Realtime must stay enabled: several migrations create policies
# on realtime.messages and add tables to the supabase_realtime publication,
# which fail to apply if the realtime schema doesn't exist — that's a
# migration-time dependency, independent of whether this test suite exercises
# realtime itself. Studio/Analytics/Edge Functions are disabled (this suite
# never touches them) to keep CI startup faster.
#
# Full reference: https://supabase.com/docs/guides/local-development/cli/config
project_id = "tripper"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = false

[realtime]
enabled = true

[studio]
enabled = false

[local_smtp]
enabled = false

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = []
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 6

[auth.email]
enable_signup = true
enable_confirmations = false

[auth.sms]
enable_signup = false

[edge_runtime]
enabled = false

[analytics]
enabled = false
