<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; background: #000010; }
    @keyframes nbFloat {
      0%, 100% { transform: translate(0,0) scale(1); opacity: 0.7; }
      50% { transform: translate(8px,-10px) scale(1.08); opacity: 1; }
    }
    .date-card { transition: border 0.22s ease, box-shadow 0.22s ease, transform 0.18s cubic-bezier(.34,1.4,.64,1); cursor: pointer; }
    .date-card:hover { transform: translateY(-3px) scale(1.02); }
    .date-card:active { transform: scale(0.97) !important; }
    .cbtn { transition: transform 0.2s cubic-bezier(.34,1.4,.64,1), box-shadow 0.2s ease; }
    .cbtn:hover { transform: translateY(-2px); }
    .cbtn:active { transform: scale(0.98) !important; }
    .ghost-btn { transition: opacity 0.18s; }
    .ghost-btn:hover { opacity: 0.7; }
    .toggle-track { transition: background 0.3s ease; }
    .toggle-thumb { transition: transform 0.3s cubic-bezier(.34,1.4,.64,1), background 0.3s ease; }
    .nights-badge { animation: badgePop 0.45s cubic-bezier(.34,1.4,.64,1) both; }
    .cal-input::-webkit-calendar-picker-indicator { display: none; }
  </style>
</helmet>

<div style="height:100vh; background:#000010; display:flex; align-items:center; justify-content:center; font-family:'Inter',system-ui,sans-serif; overflow:hidden;">

  <canvas id="sc2" style="position:fixed; inset:0; width:100vw; height:100vh; pointer-events:none; z-index:0;"></canvas>

  <div id="phone-wrapper2">
  <div style="width:390px; height:844px; background:linear-gradient(175deg, rgba(12,4,35,.97) 0%, rgba(0,0,20,.99) 100%); border-radius:52px; border:1px solid rgba(130,80,240,.14); position:relative; overflow:hidden; display:flex; flex-direction:column; z-index:1; box-shadow:0 0 0 1px rgba(0,0,0,.9), 0 40px 120px rgba(0,0,50,.85), inset 0 1px 0 rgba(255,255,255,.05);">

    <div style="position:absolute; top:-110px; left:-80px; width:350px; height:350px; background:radial-gradient(circle, rgba(70,20,175,.28) 0%, transparent 65%); animation:nbFloat 10s ease-in-out infinite; pointer-events:none; z-index:0;"></div>
    <div style="position:absolute; bottom:60px; right:-100px; width:310px; height:310px; background:radial-gradient(circle, rgba(20,55,195,.2) 0%, transparent 60%); animation:nbFloat 15s ease-in-out infinite reverse; pointer-events:none; z-index:0;"></div>
    <div style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:380px; height:180px; background:radial-gradient(ellipse, rgba(245,158,11,.04) 0%, transparent 70%); pointer-events:none; z-index:0;"></div>

    <div style="position:relative; z-index:1; display:flex; flex-direction:column; height:100%; padding:0 24px 36px;">

      <!-- Status bar spacer -->
      <div style="height:54px; flex-shrink:0;"></div>

      <!-- Header -->
      <div style="display:flex; align-items:center; justify-content:space-between; flex-shrink:0; margin-bottom:26px;">
        <button class="ghost-btn" style="width:42px; height:42px; border-radius:14px; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.1); display:flex; align-items:center; justify-content:center; cursor:pointer; backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); outline:none; padding:0; flex-shrink:0;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M15 19L8 12L15 5" stroke="rgba(255,255,255,.9)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
        </button>
        <h2 style="margin:0; font-size:17px; font-weight:600; color:rgba(255,255,255,.95); letter-spacing:-.3px;">New Trip</h2>
        <div style="background:rgba(255,255,255,.05); border:1px solid rgba(180,160,255,.13); border-radius:20px; padding:7px 14px; backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);">
          <span style="font-size:12px; font-weight:500; color:rgba(200,185,255,.7);">2 of 5</span>
        </div>
      </div>

      <!-- Progress dots -->
      <div style="display:flex; gap:8px; justify-content:center; flex-shrink:0; margin-bottom:36px;">
        <sc-for list="{{ dots }}" as="dot" hint-placeholder-count="5">
          <div style="{{ dot.style }}"></div>
        </sc-for>
      </div>

      <!-- Section label -->
      <p style="margin:0 0 16px; font-size:11px; font-weight:700; letter-spacing:1.3px; text-transform:uppercase; color:rgba(200,185,240,.45); flex-shrink:0;">When are you going?</p>

      <!-- Date cards -->
      <div style="display:flex; gap:14px; flex-shrink:0; margin-bottom:22px;">

        <!-- Departure -->
        <div class="date-card" style="{{ depCardStyle }}" onClick="{{ onSelectDep }}">
          <div style="display:flex; align-items:center; gap:8px; margin-bottom:14px;">
            <div style="width:32px; height:32px; border-radius:10px; background:rgba(255,255,255,.08); display:flex; align-items:center; justify-content:center;">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none">
                <rect x="3" y="4" width="18" height="17" rx="3" stroke="rgba(255,255,255,.6)" stroke-width="1.8"></rect>
                <line x1="3" y1="9" x2="21" y2="9" stroke="rgba(255,255,255,.6)" stroke-width="1.8"></line>
                <line x1="8" y1="2" x2="8" y2="6" stroke="rgba(255,255,255,.6)" stroke-width="1.8" stroke-linecap="round"></line>
                <line x1="16" y1="2" x2="16" y2="6" stroke="rgba(255,255,255,.6)" stroke-width="1.8" stroke-linecap="round"></line>
              </svg>
            </div>
            <span style="font-size:10px; font-weight:600; letter-spacing:1px; text-transform:uppercase; color:rgba(200,185,255,.5);">Departure</span>
          </div>
          <div style="font-size:38px; font-weight:800; color:rgba(255,255,255,.96); line-height:1; margin-bottom:5px; letter-spacing:-1.5px;">{{ depDay }}</div>
          <div style="font-size:12px; font-weight:500; color:rgba(200,185,255,.55); letter-spacing:.2px;">{{ depMonthYear }}</div>
          <input type="date" class="cal-input" id="dep-input" value="{{ depValue }}" onInput="{{ onDepChange }}" style="position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%;" />
        </div>

        <!-- Return -->
        <div class="date-card" style="{{ retCardStyle }}" onClick="{{ onSelectRet }}">
          <div style="display:flex; align-items:center; gap:8px; margin-bottom:14px;">
            <div style="width:32px; height:32px; border-radius:10px; background:rgba(255,255,255,.08); display:flex; align-items:center; justify-content:center;">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none">
                <rect x="3" y="4" width="18" height="17" rx="3" stroke="rgba(255,255,255,.6)" stroke-width="1.8"></rect>
                <line x1="3" y1="9" x2="21" y2="9" stroke="rgba(255,255,255,.6)" stroke-width="1.8"></line>
                <line x1="8" y1="2" x2="8" y2="6" stroke="rgba(255,255,255,.6)" stroke-width="1.8" stroke-linecap="round"></line>
                <line x1="16" y1="2" x2="16" y2="6" stroke="rgba(255,255,255,.6)" stroke-width="1.8" stroke-linecap="round"></line>
              </svg>
            </div>
            <span style="font-size:10px; font-weight:600; letter-spacing:1px; text-transform:uppercase; color:rgba(200,185,255,.5);">Return</span>
          </div>
          <div style="font-size:38px; font-weight:800; color:rgba(255,255,255,.96); line-height:1; margin-bottom:5px; letter-spacing:-1.5px;">{{ retDay }}</div>
          <div style="font-size:12px; font-weight:500; color:rgba(200,185,255,.55); letter-spacing:.2px;">{{ retMonthYear }}</div>
          <input type="date" class="cal-input" id="ret-input" value="{{ retValue }}" onInput="{{ onRetChange }}" style="position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%;" />
        </div>

      </div>

      <!-- Nights badge -->
      <div style="display:flex; justify-content:center; align-items:center; flex-shrink:0; margin-bottom:28px;">
        <div style="background:#1f1500; border:1.5px solid #c27802; border-radius:999px; padding:10px 22px; display:flex; align-items:center; gap:8px; box-shadow:0 0 18px rgba(194,120,2,0.35);">
          <span style="font-size:15px; line-height:1;">🌙</span>
          <span style="font-size:13px; font-weight:700; color:#F59E0B; letter-spacing:0.1px; white-space:nowrap;">{{ durationLabel }}</span>
        </div>
      </div>

      <!-- Flexible dates toggle -->
      <div style="background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.08); border-radius:20px; padding:18px 20px; display:flex; align-items:center; gap:14px; flex-shrink:0; backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); margin-bottom:auto;">
        <div style="width:40px; height:40px; border-radius:13px; background:rgba(245,158,11,.1); border:1px solid rgba(245,158,11,.2); display:flex; align-items:center; justify-content:center; flex-shrink:0;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z" fill="rgba(245,158,11,.85)" stroke="none"></path>
          </svg>
        </div>
        <div style="flex:1; min-width:0;">
          <div style="font-size:14px; font-weight:600; color:rgba(255,255,255,.9); margin-bottom:2px;">Dates flexible?</div>
          <div style="font-size:12px; color:rgba(200,185,255,.45); font-weight:400;">±3 days either side</div>
        </div>
        <div onClick="{{ onToggleFlexible }}" style="cursor:pointer; flex-shrink:0;" >
          <div class="toggle-track" style="{{ toggleTrackStyle }}">
            <div class="toggle-thumb" style="{{ toggleThumbStyle }}"></div>
          </div>
        </div>
      </div>

      <div style="height:28px; flex-shrink:0;"></div>

      <!-- Buttons -->
      <button class="cbtn" style="{{ continueStyle }}">Continue →</button>
      <div style="height:12px; flex-shrink:0;"></div>
      <button class="ghost-btn" style="width:100%; height:50px; border-radius:16px; background:transparent; border:1px solid rgba(255,255,255,.1); cursor:pointer; font-family:inherit; font-size:15px; font-weight:500; color:rgba(255,255,255,.45); outline:none; flex-shrink:0; letter-spacing:-.1px;">Back</button>

    </div>
  </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;$preview&quot;: { &quot;width&quot;: 430, &quot;height&quot;: 930 },
  &quot;accentColor&quot;: {
    &quot;editor&quot;: &quot;color&quot;,
    &quot;default&quot;: &quot;#F59E0B&quot;,
    &quot;options&quot;: [&quot;#F59E0B&quot;, &quot;#F97316&quot;, &quot;#EC4899&quot;, &quot;#6366F1&quot;]
  }
}">
class Component extends DCLogic {
  state = {
    selectedCard: 'dep',
    flexible: false,
    depDate: new Date(2025, 7, 15),  // Aug 15 2025
    retDate: new Date(2025, 7, 22),  // Aug 22 2025
  };

  _applyScale() {
    let st = document.getElementById('__pscale2');
    if (!st) { st = document.createElement('style'); st.id = '__pscale2'; document.head.appendChild(st); }
    const s = Math.min(1, (window.innerHeight - 40) / 844, (window.innerWidth - 40) / 390);
    st.textContent = `#phone-wrapper2 { zoom: ${s.toFixed(4)}; }`;
  }

  componentDidMount() {
    this._applyScale();
    window.addEventListener('resize', () => this._applyScale());
    // draw star canvas
    const c = document.getElementById('sc2');
    if (!c) return;
    const ctx = c.getContext('2d');
    c.width = window.innerWidth;
    c.height = window.innerHeight;
    const r = () => Math.random();
    for (let i = 0; i < 200; i++) {
      const x = r() * c.width, y = r() * c.height;
      const rad = r() * 1.3 + 0.15;
      const a = r() * 0.5 + 0.15;
      ctx.beginPath(); ctx.arc(x, y, rad, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,255,255,${a.toFixed(2)})`; ctx.fill();
    }
    const tints = ['200,175,255','175,215,255','255,238,185','210,235,255'];
    for (let i = 0; i < 70; i++) {
      const x = r() * c.width, y = r() * c.height;
      const rad = r() * 0.85 + 0.15, a = r() * 0.55 + 0.2;
      ctx.beginPath(); ctx.arc(x, y, rad, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${tints[Math.floor(r()*tints.length)]},${a.toFixed(2)})`; ctx.fill();
    }
    for (let i = 0; i < 12; i++) {
      const x = r() * c.width, y = r() * c.height;
      ctx.beginPath(); ctx.arc(x, y, r() * 1.8 + 0.8, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,0.9)'; ctx.fill();
    }
  }

  renderVals() {
    const accent = this.props.accentColor ?? '#F59E0B';
    const { selectedCard, flexible, depDate, retDate } = this.state;

    // Dots
    const dots = Array.from({ length: 5 }, (_, i) => ({
      style: {
        width: '10px', height: '10px', borderRadius: '50%', flexShrink: 0,
        background: i < 2 ? accent : 'rgba(255,255,255,0.1)',
        border: i < 2 ? 'none' : '1.5px solid rgba(255,255,255,0.18)',
        boxShadow: i === 1
          ? `0 0 10px ${accent}dd, 0 0 20px ${accent}77`
          : i === 0 ? `0 0 6px ${accent}88` : 'none',
        transition: 'all 0.4s ease',
      }
    }));

    // Date formatting
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const fmt = d => ({
      day: String(d.getDate()).padStart(2, '0'),
      monthYear: `${months[d.getMonth()]} ${d.getFullYear()}`,
      value: `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,
    });

    const dep = fmt(depDate);
    const ret = fmt(retDate);

    // Duration
    const msPerDay = 86400000;
    const nights = Math.max(0, Math.round((retDate - depDate) / msPerDay));
    const days = nights + 1;
    const durationLabel = nights > 0 ? `${nights} night${nights !== 1 ? 's' : ''} · ${days} days` : 'Same day';

    // Card styles
    const cardBase = {
      flex: 1, borderRadius: '22px', padding: '18px 16px', position: 'relative',
      overflow: 'hidden', backdropFilter: 'blur(16px)', WebkitBackdropFilter: 'blur(16px)',
      background: 'rgba(255,255,255,.04)',
    };
    const depCardStyle = {
      ...cardBase,
      border: selectedCard === 'dep' ? `1.5px solid ${accent}` : '1.5px solid rgba(255,255,255,.09)',
      boxShadow: selectedCard === 'dep'
        ? `0 0 0 3px ${accent}22, 0 0 24px ${accent}44, inset 0 1px 0 rgba(255,255,255,.1)`
        : '0 2px 16px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.05)',
    };
    const retCardStyle = {
      ...cardBase,
      border: selectedCard === 'ret' ? `1.5px solid ${accent}` : '1.5px solid rgba(255,255,255,.09)',
      boxShadow: selectedCard === 'ret'
        ? `0 0 0 3px ${accent}22, 0 0 24px ${accent}44, inset 0 1px 0 rgba(255,255,255,.1)`
        : '0 2px 16px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.05)',
    };

    // Nights badge
    const nightsBadgeStyle = {
      display: 'inline-flex', alignItems: 'center', gap: '7px',
      background: 'rgba(245,158,11,.1)', border: '1px solid rgba(245,158,11,.3)',
      borderRadius: '30px', padding: '9px 18px',
      boxShadow: '0 0 20px rgba(245,158,11,.12)',
    };

    // Toggle
    const toggleTrackStyle = {
      width: '48px', height: '28px', borderRadius: '14px',
      background: flexible ? `${accent}` : 'rgba(255,255,255,.12)',
      border: flexible ? `1px solid ${accent}` : '1px solid rgba(255,255,255,.15)',
      position: 'relative', display: 'flex', alignItems: 'center', padding: '3px',
    };
    const toggleThumbStyle = {
      width: '22px', height: '22px', borderRadius: '50%',
      background: flexible ? '#fff' : 'rgba(255,255,255,.6)',
      boxShadow: '0 2px 6px rgba(0,0,0,.35)',
      transform: flexible ? 'translateX(20px)' : 'translateX(0)',
      flexShrink: 0,
    };

    // Continue button
    const continueStyle = {
      width: '100%', height: '62px', borderRadius: '20px',
      background: `linear-gradient(130deg, #c27802 0%, ${accent} 48%, #fde47a 100%)`,
      border: 'none', cursor: 'pointer', fontFamily: 'inherit',
      fontSize: '17px', fontWeight: 700, color: '#1a0e00', letterSpacing: '-.2px',
      outline: 'none', flexShrink: 0,
      boxShadow: `0 8px 32px ${accent}55, 0 2px 8px ${accent}33, inset 0 1px 0 rgba(255,255,255,.35)`,
    };

    return {
      dots,
      depDay: dep.day, depMonthYear: dep.monthYear, depValue: dep.value,
      retDay: ret.day, retMonthYear: ret.monthYear, retValue: ret.value,
      durationLabel, depCardStyle, retCardStyle, nightsBadgeStyle,
      toggleTrackStyle, toggleThumbStyle, continueStyle,
      onSelectDep: () => { this.setState({ selectedCard: 'dep' }); document.getElementById('dep-input') && document.getElementById('dep-input').showPicker && document.getElementById('dep-input').showPicker(); },
      onSelectRet: () => { this.setState({ selectedCard: 'ret' }); document.getElementById('ret-input') && document.getElementById('ret-input').showPicker && document.getElementById('ret-input').showPicker(); },
      onDepChange: (e) => { const d = new Date(e.target.value + 'T00:00:00'); if (!isNaN(d)) this.setState({ depDate: d }); },
      onRetChange: (e) => { const d = new Date(e.target.value + 'T00:00:00'); if (!isNaN(d)) this.setState({ retDate: d }); },
      onToggleFlexible: () => this.setState(s => ({ flexible: !s.flexible })),
    };
  }
}
</script>
</body>
</html>
