<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; background: #000010; }
    @keyframes nbFloat {
      0%, 100% { transform: translate(0,0) scale(1); opacity: 0.7; }
      50% { transform: translate(8px,-10px) scale(1.08); opacity: 1; }
    }
    .chip-remove { transition: opacity 0.15s, transform 0.15s; }
    .chip-remove:hover { opacity: 0.7; transform: scale(1.2); }
    .pop-chip { transition: background 0.18s, border-color 0.18s, transform 0.18s cubic-bezier(.34,1.4,.64,1); }
    .pop-chip:hover { transform: translateY(-2px) scale(1.04); background: rgba(245,158,11,0.14) !important; }
    .pop-chip:active { transform: scale(0.96) !important; }
    .drop-item:hover { background: rgba(255,255,255,0.06) !important; }
    .cbtn { transition: transform 0.2s cubic-bezier(.34,1.4,.64,1); }
    .cbtn:hover { transform: translateY(-2px); }
    .cbtn:active { transform: scale(0.98) !important; }
    .ghost-btn { transition: opacity 0.18s; }
    .ghost-btn:hover { opacity: 0.6; }
    .chip-scroll::-webkit-scrollbar { display: none; }
    .chip-scroll { scrollbar-width: none; }
  </style>
</helmet>

<div style="height:100vh; background:#000010; display:flex; align-items:center; justify-content:center; font-family:'Inter',system-ui,sans-serif; overflow:hidden;">

  <canvas id="sc3" style="position:fixed; inset:0; width:100vw; height:100vh; pointer-events:none; z-index:0;"></canvas>

  <div id="phone-wrapper3">
  <div style="width:390px; height:844px; background:linear-gradient(175deg,rgba(12,4,35,.97) 0%,rgba(0,0,20,.99) 100%); border-radius:52px; border:1px solid rgba(130,80,240,.14); position:relative; overflow:hidden; display:flex; flex-direction:column; z-index:1; box-shadow:0 0 0 1px rgba(0,0,0,.9),0 40px 120px rgba(0,0,50,.85),inset 0 1px 0 rgba(255,255,255,.05);">

    <div style="position:absolute; top:-110px; left:-80px; width:350px; height:350px; background:radial-gradient(circle,rgba(70,20,175,.28) 0%,transparent 65%); animation:nbFloat 10s ease-in-out infinite; pointer-events:none; z-index:0;"></div>
    <div style="position:absolute; bottom:60px; right:-100px; width:310px; height:310px; background:radial-gradient(circle,rgba(20,55,195,.2) 0%,transparent 60%); animation:nbFloat 15s ease-in-out infinite reverse; pointer-events:none; z-index:0;"></div>

    <div style="position:relative; z-index:1; display:flex; flex-direction:column; height:100%; padding:0 24px 36px;">

      <div style="height:54px; flex-shrink:0;"></div>

      <!-- Header -->
      <div style="display:flex; align-items:center; justify-content:space-between; flex-shrink:0; margin-bottom:26px;">
        <button class="ghost-btn" style="width:42px; height:42px; border-radius:14px; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.1); display:flex; align-items:center; justify-content:center; cursor:pointer; outline:none; padding:0; flex-shrink:0;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M15 19L8 12L15 5" stroke="rgba(255,255,255,.9)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        </button>
        <h2 style="margin:0; font-size:17px; font-weight:600; color:rgba(255,255,255,.95); letter-spacing:-.3px;">New Trip</h2>
        <div style="background:rgba(255,255,255,.05); border:1px solid rgba(180,160,255,.13); border-radius:20px; padding:7px 14px;">
          <span style="font-size:12px; font-weight:500; color:rgba(200,185,255,.7);">3 of 5</span>
        </div>
      </div>

      <!-- Progress dots -->
      <div style="display:flex; gap:8px; justify-content:center; flex-shrink:0; margin-bottom:30px;">
        <sc-for list="{{ dots }}" as="dot" hint-placeholder-count="5">
          <div style="{{ dot.style }}"></div>
        </sc-for>
      </div>

      <!-- Heading -->
      <p style="margin:0 0 14px; font-size:11px; font-weight:700; letter-spacing:1.3px; text-transform:uppercase; color:rgba(200,185,240,.45); flex-shrink:0;">Where are you going?</p>

      <!-- Search bar + dropdown -->
      <div style="position:relative; flex-shrink:0; margin-bottom:16px; z-index:10;">
        <div style="display:flex; align-items:center; gap:12px; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.1); border-radius:18px; padding:0 18px; height:54px; backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" style="flex-shrink:0;">
            <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z" fill="rgba(245,158,11,0.7)"></path>
            <circle cx="12" cy="9" r="2.5" fill="rgba(0,0,0,0.4)"></circle>
          </svg>
          <input
            type="text"
            placeholder="Add a country or city..."
            value="{{ searchText }}"
            onInput="{{ onSearchChange }}"
            onFocus="{{ onSearchFocus }}"
            onBlur="{{ onSearchBlur }}"
            style="flex:1; background:transparent; border:none; outline:none; font-family:inherit; font-size:15px; font-weight:500; color:rgba(255,255,255,.9); caret-color:#F59E0B;"
          />
        </div>

        <!-- Dropdown -->
        <sc-if value="{{ showDropdown }}" hint-placeholder-val="{{ false }}">
          <div style="position:absolute; top:60px; left:0; right:0; background:rgba(14,8,38,.97); border:1px solid rgba(255,255,255,.1); border-radius:16px; overflow:hidden; box-shadow:0 16px 48px rgba(0,0,0,.7); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);">
            <sc-for list="{{ dropdownItems }}" as="item" hint-placeholder-count="3">
              <div class="drop-item" onClick="{{ item.onClick }}" style="padding:14px 18px; font-size:14px; font-weight:500; color:rgba(255,255,255,.85); cursor:pointer; display:flex; align-items:center; gap:10px; border-bottom:1px solid rgba(255,255,255,.05);">{{ item.label }}</div>
            </sc-for>
          </div>
        </sc-if>
      </div>

      <!-- Added destination chips -->
      <div class="chip-scroll" style="display:flex; gap:9px; overflow-x:auto; flex-shrink:0; margin:0 -24px; padding:2px 24px 14px;">
        <sc-for list="{{ destChips }}" as="chip" hint-placeholder-count="2">
          <div style="display:inline-flex; align-items:center; gap:8px; background:rgba(245,158,11,0.1); border:1.5px solid #c27802; border-radius:999px; padding:8px 14px 8px 16px; white-space:nowrap; flex-shrink:0;">
            <span style="font-size:13px; font-weight:600; color:#F59E0B; letter-spacing:0.1px;">{{ chip.label }}</span>
            <button class="chip-remove" onClick="{{ chip.onRemove }}" style="background:rgba(245,158,11,0.2); border:none; border-radius:50%; width:18px; height:18px; display:flex; align-items:center; justify-content:center; cursor:pointer; outline:none; padding:0; color:#F59E0B; font-size:11px; font-weight:700; line-height:1; flex-shrink:0;">✕</button>
          </div>
        </sc-for>
        <sc-if value="{{ noDestinations }}" hint-placeholder-val="{{ false }}">
          <div style="display:inline-flex; align-items:center; border:1.5px dashed rgba(255,255,255,0.15); border-radius:999px; padding:8px 18px; white-space:nowrap;">
            <span style="font-size:13px; color:rgba(255,255,255,0.25); font-weight:500;">No destinations yet</span>
          </div>
        </sc-if>
      </div>

      <!-- Globe -->
      <div style="flex-shrink:0; margin-bottom:18px; display:flex; justify-content:center;">
        <div style="position:relative; width:342px; height:190px; border-radius:20px; overflow:hidden; background:rgba(6,3,22,0.7); border:1px solid rgba(130,90,255,0.15); box-shadow:0 4px 24px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.04);">
          <canvas id="globe-canvas" width="342" height="190" style="display:block; width:342px; height:190px;"></canvas>
          <!-- Corner label -->
          <div style="position:absolute; bottom:10px; right:14px; font-size:10px; font-weight:600; letter-spacing:0.8px; text-transform:uppercase; color:rgba(200,185,255,0.25);">{{ globeLabel }}</div>
        </div>
      </div>

      <!-- Popular suggestions -->
      <div style="flex-shrink:0; margin-bottom:auto;">
        <p style="margin:0 0 12px; font-size:10px; font-weight:700; letter-spacing:1.2px; text-transform:uppercase; color:rgba(200,185,240,0.38);">Popular</p>
        <div style="display:flex; gap:9px; flex-wrap:wrap;">
          <sc-for list="{{ popularChips }}" as="chip" hint-placeholder-count="4">
            <div class="pop-chip" onClick="{{ chip.onClick }}" style="display:inline-flex; align-items:center; gap:6px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); border-radius:999px; padding:9px 16px; cursor:pointer; white-space:nowrap;">
              <span style="font-size:13px; font-weight:600; color:rgba(255,255,255,0.75);">{{ chip.label }}</span>
            </div>
          </sc-for>
          <sc-if value="{{ allPopularAdded }}" hint-placeholder-val="{{ false }}">
            <div style="display:inline-flex; align-items:center; padding:9px 16px;">
              <span style="font-size:12px; color:rgba(255,255,255,0.2); font-weight:500;">All added ✓</span>
            </div>
          </sc-if>
        </div>
      </div>

      <div style="height:24px; flex-shrink:0;"></div>

      <!-- Buttons -->
      <button class="cbtn" style="{{ continueStyle }}">Continue →</button>
      <div style="height:12px; flex-shrink:0;"></div>
      <button class="ghost-btn" style="width:100%; height:50px; border-radius:16px; background:transparent; border:1px solid rgba(255,255,255,.1); cursor:pointer; font-family:inherit; font-size:15px; font-weight:500; color:rgba(255,255,255,.4); outline:none; flex-shrink:0;">Back</button>

    </div>
  </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;$preview&quot;: { &quot;width&quot;: 430, &quot;height&quot;: 930 },
  &quot;accentColor&quot;: {
    &quot;editor&quot;: &quot;color&quot;,
    &quot;default&quot;: &quot;#F59E0B&quot;,
    &quot;options&quot;: [&quot;#F59E0B&quot;, &quot;#F97316&quot;, &quot;#EC4899&quot;, &quot;#6366F1&quot;]
  }
}">
class Component extends DCLogic {
  state = {
    searchText: '',
    showDropdown: false,
    destinations: [
      { name: 'Italy',  flag: '🇮🇹', lat: 41.9, lng: 12.5 },
      { name: 'France', flag: '🇫🇷', lat: 46.2, lng: 2.2  },
    ],
  };

  _COUNTRIES = [
    { name: 'Italy',     flag: '🇮🇹', lat: 41.9,  lng: 12.5  },
    { name: 'France',    flag: '🇫🇷', lat: 46.2,  lng: 2.2   },
    { name: 'Japan',     flag: '🇯🇵', lat: 36.2,  lng: 138.3 },
    { name: 'Thailand',  flag: '🇹🇭', lat: 15.9,  lng: 100.9 },
    { name: 'Spain',     flag: '🇪🇸', lat: 40.4,  lng: -3.7  },
    { name: 'Greece',    flag: '🇬🇷', lat: 39.1,  lng: 21.8  },
    { name: 'Portugal',  flag: '🇵🇹', lat: 39.4,  lng: -8.2  },
    { name: 'USA',       flag: '🇺🇸', lat: 37.1,  lng: -95.7 },
    { name: 'Morocco',   flag: '🇲🇦', lat: 31.8,  lng: -7.1  },
    { name: 'Turkey',    flag: '🇹🇷', lat: 38.9,  lng: 35.2  },
    { name: 'Croatia',   flag: '🇭🇷', lat: 45.1,  lng: 15.2  },
    { name: 'Indonesia', flag: '🇮🇩', lat: -0.8,  lng: 113.9 },
    { name: 'India',     flag: '🇮🇳', lat: 20.6,  lng: 78.9  },
    { name: 'Vietnam',   flag: '🇻🇳', lat: 14.1,  lng: 108.3 },
    { name: 'Australia', flag: '🇦🇺', lat: -25.3, lng: 133.8 },
    { name: 'UK',        flag: '🇬🇧', lat: 55.4,  lng: -3.4  },
    { name: 'Germany',   flag: '🇩🇪', lat: 51.2,  lng: 10.5  },
    { name: 'Mexico',    flag: '🇲🇽', lat: 23.6,  lng: -102.6},
    { name: 'Brazil',    flag: '🇧🇷', lat: -14.2, lng: -51.9 },
    { name: 'Canada',    flag: '🇨🇦', lat: 56.1,  lng: -106.3},
  ];

  _POPULAR = ['Japan', 'Thailand', 'Greece', 'Portugal'];

  _applyScale() {
    let st = document.getElementById('__pscale3');
    if (!st) { st = document.createElement('style'); st.id = '__pscale3'; document.head.appendChild(st); }
    const s = Math.min(1, (window.innerHeight - 40) / 844, (window.innerWidth - 40) / 390);
    st.textContent = `#phone-wrapper3 { zoom: ${s.toFixed(4)}; }`;
  }

  _drawGlobe() {
    const canvas = document.getElementById('globe-canvas');
    if (!canvas) return;
    const { destinations } = this.state;
    const W = canvas.width, H = canvas.height;
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, W, H);
    const cx = W / 2, cy = H / 2;
    const R = H / 2 - 8;

    // Compute globe center — average destination longitude
    const lons = destinations.map(d => d.lng);
    let centerLon = lons.length > 0 ? lons.reduce((a, b) => a + b, 0) / lons.length : 18;
    const λ0 = centerLon * Math.PI / 180;
    const φ0 = 15 * Math.PI / 180;

    const project = (latDeg, lonDeg) => {
      const φ = latDeg * Math.PI / 180;
      const λ = lonDeg * Math.PI / 180;
      const cosC = Math.sin(φ0) * Math.sin(φ) + Math.cos(φ0) * Math.cos(φ) * Math.cos(λ - λ0);
      const x = R * Math.cos(φ) * Math.sin(λ - λ0);
      const y = -R * (Math.cos(φ0) * Math.sin(φ) - Math.sin(φ0) * Math.cos(φ) * Math.cos(λ - λ0));
      return { x: cx + x, y: cy + y, visible: cosC > 0.02 };
    };

    // Globe background
    const bg = ctx.createRadialGradient(cx - R * 0.25, cy - R * 0.3, 0, cx, cy, R);
    bg.addColorStop(0, '#0e0838');
    bg.addColorStop(0.65, '#06041a');
    bg.addColorStop(1, '#020110');
    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, R, 0, Math.PI * 2);
    ctx.fillStyle = bg;
    ctx.fill();
    ctx.restore();

    // Clip to globe
    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, R, 0, Math.PI * 2);
    ctx.clip();

    // Graticule
    ctx.lineWidth = 0.5;
    for (let lon = -180; lon <= 180; lon += 30) {
      ctx.beginPath();
      let started = false;
      for (let lat = -88; lat <= 88; lat += 3) {
        const p = project(lat, lon);
        if (p.visible) {
          if (!started) { ctx.moveTo(p.x, p.y); started = true; }
          else ctx.lineTo(p.x, p.y);
        } else { started = false; }
      }
      ctx.strokeStyle = lon === 0 ? 'rgba(150,120,255,0.22)' : 'rgba(120,90,220,0.11)';
      ctx.stroke();
    }
    for (let lat = -60; lat <= 60; lat += 30) {
      ctx.beginPath();
      let started = false;
      for (let lon = -180; lon <= 180; lon += 3) {
        const p = project(lat, lon);
        if (p.visible) {
          if (!started) { ctx.moveTo(p.x, p.y); started = true; }
          else ctx.lineTo(p.x, p.y);
        } else { started = false; }
      }
      ctx.strokeStyle = lat === 0 ? 'rgba(150,120,255,0.25)' : 'rgba(120,90,220,0.11)';
      ctx.lineWidth = lat === 0 ? 0.8 : 0.5;
      ctx.stroke();
    }
    ctx.restore();

    // Atmosphere rim
    const rim = ctx.createRadialGradient(cx, cy, R * 0.72, cx, cy, R);
    rim.addColorStop(0, 'rgba(80,45,200,0)');
    rim.addColorStop(0.7, 'rgba(80,45,200,0.07)');
    rim.addColorStop(1, 'rgba(100,60,220,0.28)');
    ctx.beginPath();
    ctx.arc(cx, cy, R, 0, Math.PI * 2);
    ctx.fillStyle = rim;
    ctx.fill();

    // Border
    ctx.beginPath();
    ctx.arc(cx, cy, R, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(140,100,255,0.35)';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // Destination dots
    destinations.forEach(dest => {
      const p = project(dest.lat, dest.lng);
      if (!p.visible) return;

      // Outer glow
      const grd = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, 22);
      grd.addColorStop(0, 'rgba(245,158,11,0.75)');
      grd.addColorStop(0.35, 'rgba(245,158,11,0.28)');
      grd.addColorStop(1, 'rgba(245,158,11,0)');
      ctx.beginPath();
      ctx.arc(p.x, p.y, 22, 0, Math.PI * 2);
      ctx.fillStyle = grd;
      ctx.fill();

      // Core dot
      ctx.beginPath();
      ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
      ctx.fillStyle = '#F59E0B';
      ctx.fill();

      ctx.beginPath();
      ctx.arc(p.x, p.y, 2.5, 0, Math.PI * 2);
      ctx.fillStyle = '#fff8e7';
      ctx.fill();
    });
  }

  componentDidMount() {
    this._applyScale();
    window.addEventListener('resize', () => this._applyScale());

    // Stars
    const c = document.getElementById('sc3');
    if (c) {
      const ctx = c.getContext('2d');
      c.width = window.innerWidth; c.height = window.innerHeight;
      const r = () => Math.random();
      for (let i = 0; i < 200; i++) {
        const x = r() * c.width, y = r() * c.height;
        ctx.beginPath(); ctx.arc(x, y, r() * 1.3 + 0.15, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255,255,255,${(r() * 0.5 + 0.15).toFixed(2)})`; ctx.fill();
      }
      const tints = ['200,175,255','175,215,255','255,238,185','210,235,255'];
      for (let i = 0; i < 70; i++) {
        const x = r() * c.width, y = r() * c.height;
        ctx.beginPath(); ctx.arc(x, y, r() * 0.85 + 0.15, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(${tints[Math.floor(r()*tints.length)]},${(r() * 0.55 + 0.2).toFixed(2)})`; ctx.fill();
      }
    }
    this._drawGlobe();
  }

  componentDidUpdate() { this._drawGlobe(); }

  renderVals() {
    const accent = this.props.accentColor ?? '#F59E0B';
    const { searchText, showDropdown, destinations } = this.state;
    const addedNames = destinations.map(d => d.name);

    // Dots
    const dots = Array.from({ length: 5 }, (_, i) => ({
      style: {
        width: '10px', height: '10px', borderRadius: '50%', flexShrink: 0,
        background: i < 3 ? accent : 'rgba(255,255,255,0.1)',
        border: i < 3 ? 'none' : '1.5px solid rgba(255,255,255,0.18)',
        boxShadow: i === 2
          ? `0 0 10px ${accent}dd, 0 0 20px ${accent}77`
          : i < 2 ? `0 0 6px ${accent}88` : 'none',
      }
    }));

    // Chips
    const destChips = destinations.map(d => ({
      label: `${d.flag} ${d.name}`,
      name: d.name,
      onRemove: () => this.setState(s => ({
        destinations: s.destinations.filter(x => x.name !== d.name),
      })),
    }));

    // Search dropdown
    const available = this._COUNTRIES.filter(c => !addedNames.includes(c.name));
    const filtered = searchText.length > 0
      ? available.filter(c => c.name.toLowerCase().includes(searchText.toLowerCase())).slice(0, 5)
      : [];
    const dropdownItems = filtered.map(c => ({
      label: `${c.flag}  ${c.name}`,
      onClick: () => this.setState(s => ({
        destinations: [...s.destinations, c],
        searchText: '',
        showDropdown: false,
      })),
    }));

    // Popular
    const popularPool = this._COUNTRIES.filter(c => this._POPULAR.includes(c.name) && !addedNames.includes(c.name));
    const popularChips = popularPool.map(c => ({
      label: `${c.flag} ${c.name}`,
      onClick: () => this.setState(s => ({ destinations: [...s.destinations, c] })),
    }));

    // Globe label
    const globeLabel = destinations.length === 0
      ? 'Add destinations above'
      : destinations.length === 1
        ? `1 destination`
        : `${destinations.length} destinations`;

    const continueStyle = {
      width: '100%', height: '62px', borderRadius: '20px',
      background: `linear-gradient(130deg, #c27802 0%, ${accent} 48%, #fde47a 100%)`,
      border: 'none', cursor: 'pointer', fontFamily: 'inherit',
      fontSize: '17px', fontWeight: 700, color: '#1a0e00', letterSpacing: '-.2px',
      outline: 'none', flexShrink: 0,
      boxShadow: `0 8px 32px ${accent}55, 0 2px 8px ${accent}33, inset 0 1px 0 rgba(255,255,255,.35)`,
    };

    return {
      dots, destChips, dropdownItems, popularChips, globeLabel, continueStyle,
      searchText,
      showDropdown: showDropdown && dropdownItems.length > 0,
      noDestinations: destinations.length === 0,
      allPopularAdded: popularPool.length === 0,
      onSearchChange: (e) => this.setState({ searchText: e.target.value, showDropdown: true }),
      onSearchFocus:  () => this.setState({ showDropdown: true }),
      onSearchBlur:   () => setTimeout(() => this.setState({ showDropdown: false }), 180),
    };
  }
}
</script>
</body>
</html>
