name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref so the gate reflects the latest push.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default; individual jobs opt into more if they ever need it.
permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (full history for diff scanning)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies (clean, lockfile-exact)
        run: npm ci
      - name: Lint
        run: npm run lint

  typecheck:
    name: Typecheck (tsc --noEmit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies (clean, lockfile-exact)
        run: npm ci
      - name: Typecheck
        run: npm run typecheck

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies (clean, lockfile-exact)
        run: npm ci
      - name: Run tests
        run: npm test

  security-functional-tests:
    name: Functional security tests (RLS/RPC/Storage)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies (clean, lockfile-exact)
        run: npm ci
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      # Boots a throwaway local Postgres/Auth/Storage/Realtime stack (Studio/
      # Analytics/Edge Functions are disabled in supabase/config.toml — this
      # suite doesn't touch them, but Realtime must stay on since several
      # migrations depend on the realtime schema existing) and applies every
      # migration in supabase/migrations from scratch — this is the
      # "disposable environment", never a real/shared database.
      - name: Start disposable Supabase stack
        run: supabase start
      - name: Run functional security tests (RLS, SECURITY DEFINER RPCs, private Storage)
        run: npm run test:security-functional
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      - name: Stop Supabase stack
        if: always()
        run: supabase stop --no-backup

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies (clean, lockfile-exact)
        run: npm ci
      - name: Build
        run: npm run build
        env:
          # CI-only placeholder values so the build doesn't require real
          # secrets. No server data is fetched at build time (all app routes
          # render on demand), so these never touch a live backend.
          NEXT_PUBLIC_SUPABASE_URL: 'https://ci-placeholder.supabase.co'
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: 'ci-placeholder-anon-key'
          NEXT_PUBLIC_MAPBOX_TOKEN: 'ci-placeholder-mapbox-token'
          NEXT_PUBLIC_GOOGLE_MAPS_BROWSER_KEY: 'ci-placeholder-maps-key'

  quality-gate:
    name: Quality gate
    runs-on: ubuntu-latest
    needs: [secret-scan, lint, typecheck, test, security-functional-tests, build]
    if: always()
    steps:
      - name: Fail if any required check failed
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ] || \
             [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "One or more quality checks failed:"
            echo "  secret-scan:               ${{ needs.secret-scan.result }}"
            echo "  lint:                      ${{ needs.lint.result }}"
            echo "  typecheck:                 ${{ needs.typecheck.result }}"
            echo "  test:                      ${{ needs.test.result }}"
            echo "  security-functional-tests: ${{ needs.security-functional-tests.result }}"
            echo "  build:                     ${{ needs.build.result }}"
            exit 1
          fi
          echo "All quality checks passed."
